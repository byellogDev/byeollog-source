name: source-ci

on:
  pull_request:
  push:
    branches: [master, codex/public-release-v071]
  workflow_dispatch:

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests and static security gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BYEOLLOG_SERVER_DEV_20260823_SUBSCRIPTION_FIX/package-lock.json
      - name: Check repository boundary and Supabase migration policy
        run: ./scripts/Test-RepositoryBaseline.ps1
      - name: Install locked server dependencies
        working-directory: BYEOLLOG_SERVER_DEV_20260823_SUBSCRIPTION_FIX
        run: npm ci
      - name: Reject high-severity server dependency advisories
        working-directory: BYEOLLOG_SERVER_DEV_20260823_SUBSCRIPTION_FIX
        run: npm audit --audit-level=high
      - name: Run server tests and source-manifest assertions
        working-directory: BYEOLLOG_SERVER_DEV_20260823_SUBSCRIPTION_FIX
        run: npm test
      - name: Run deterministic broadcast stability gate
        working-directory: BYEOLLOG_SERVER_DEV_20260823_SUBSCRIPTION_FIX
        run: npm run stability:gate
      - name: Execute migration behavior harnesses
        shell: bash
        working-directory: BYEOLLOG_SERVER_DEV_20260823_SUBSCRIPTION_FIX
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres \
            -f test/collection-health-migration-harness.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres \
            -f test/web-session-security-migration-harness.sql

  agent:
    name: Windows AgentStore tests and release compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Check repository boundary and Supabase migration policy
        shell: pwsh
        run: ./scripts/Test-RepositoryBaseline.ps1
      - name: Restore AgentStore tests
        shell: pwsh
        working-directory: BYEOLLOG_AGENT_DEV_v07022
        run: dotnet restore AgentStoreTests/AgentStoreTests.csproj
      - name: Run AgentStore tests
        shell: pwsh
        working-directory: BYEOLLOG_AGENT_DEV_v07022
        run: dotnet run --project AgentStoreTests/AgentStoreTests.csproj -c Release --no-restore
      - name: Run Agent contract tests
        shell: pwsh
        working-directory: BYEOLLOG_AGENT_DEV_v07022
        run: node --test ContractTests/*.test.mjs
      - name: Restore production Agent project
        shell: pwsh
        working-directory: BYEOLLOG_AGENT_DEV_v07022
        run: dotnet restore HurogiCollector.csproj
      - name: Reject vulnerable production Agent packages
        shell: pwsh
        working-directory: BYEOLLOG_AGENT_DEV_v07022
        run: dotnet list HurogiCollector.csproj package --vulnerable --include-transitive
      - name: Compile production Agent release
        shell: pwsh
        working-directory: BYEOLLOG_AGENT_DEV_v07022
        run: >-
          dotnet publish HurogiCollector.csproj -c Release --no-restore
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o ci-artifacts/agent
      - name: Check the compiled update-preflight path
        shell: pwsh
        working-directory: BYEOLLOG_AGENT_DEV_v07022
        run: |
          [xml]$project = Get-Content -Raw HurogiCollector.csproj
          $expectedVersion = @($project.Project.PropertyGroup | ForEach-Object { [string]$_.Version } | Where-Object { $_ })[0]
          if ($expectedVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'A four-part Agent Version is required for update preflight.' }
          $agentPath = (Resolve-Path .\ci-artifacts\agent\byeollog.exe).Path
          $preflight = Start-Process -FilePath $agentPath -ArgumentList @('--update-preflight', $expectedVersion) -WindowStyle Hidden -Wait -PassThru
          if ($preflight.ExitCode -ne 0) { throw "Compiled Agent update preflight failed with exit code $($preflight.ExitCode)." }

  auxiliary:
    name: TTS and Relay tests and supply-chain gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BYEOLLOG_TTS_RELAY/package-lock.json
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"
      - name: Check repository boundary and Supabase migration policy
        shell: pwsh
        run: ./scripts/Test-RepositoryBaseline.ps1
      - name: Run dependency-light TTS contract tests
        working-directory: BYEOLLOG_TTS_SERVICE
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install locked Relay dependencies
        working-directory: BYEOLLOG_TTS_RELAY
        run: npm ci
      - name: Reject high-severity Relay dependency advisories
        working-directory: BYEOLLOG_TTS_RELAY
        run: npm audit --audit-level=high
      - name: Run Relay tests
        working-directory: BYEOLLOG_TTS_RELAY
        run: npm test

  production-smoke:
    name: Read-only production smoke after all source gates
    if: github.event_name == 'push'
    needs: [server, agent, auxiliary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify public production boundaries without mutations
        working-directory: BYEOLLOG_SERVER_DEV_20260823_SUBSCRIPTION_FIX
        run: npm run stability:smoke
