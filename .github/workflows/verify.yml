name: Verify canonical source
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify:source
      - run: node tools/scan-publication.mjs --tracked
      - run: npm ci --prefix tools/db-tests --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix tools/db-tests
      - run: npm test
      - run: npm run build:web
      - run: dotnet build apps/windows-agent/HurogiCollector.csproj -c Release
      - run: dotnet run --project apps/windows-agent/AgentStoreTests/AgentStoreTests.csproj -c Release
