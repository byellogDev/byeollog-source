<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>별록 로그인</title>
<link rel="icon" href="/assets/byeollog_app_icon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#1f2937;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(360px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;box-shadow:0 12px 35px #11182712}
h1{font-size:26px;margin:0}.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}.brandMark{font-size:31px;line-height:1;color:#f4c542}.sub{font-size:12px;color:#64748b;margin:0 0 20px 42px;letter-spacing:.12em}.field{margin-top:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input{width:100%;border:1px solid #d8dee8;border-radius:9px;padding:11px 12px;font:inherit}
button{width:100%;margin-top:16px;border:0;border-radius:9px;padding:11px 12px;background:#f4c542;color:#172033;font:inherit;font-weight:800;cursor:pointer}button:hover{filter:brightness(.98)}
.msg{min-height:20px;margin-top:10px;color:#b42318;font-size:13px}
.links{display:flex;justify-content:center;gap:9px;margin-top:14px}.signupLink{color:#475569;font-size:13px;text-decoration:none}.signupLink:hover{color:#111827;text-decoration:underline}.sep{color:#cbd5e1}
.login-page .login-header{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:28px;text-align:center}
.login-page .login-header a{display:block;line-height:0;border-radius:8px}
.login-page .login-header a:focus-visible{outline:2px solid var(--bl-yellow);outline-offset:5px}
.login-page .login-header .brand-logo{display:block;width:144px;height:68px;margin:0;object-fit:contain}
.login-page .login-header h1{font-size:26px;line-height:1.3;letter-spacing:-.04em;margin:0}
.login-page .login-header+.field{margin-top:0}
.login-page .field+.field{margin-top:18px}
.login-page .links{flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px!important;line-height:1.6}
@media(max-width:540px){.login-page .login-header{gap:12px;margin-bottom:24px}.login-page .login-header .brand-logo{width:128px;height:60px}}
@media(max-width:380px){.login-page .links .sep:last-of-type{display:none}.login-page .links .signupLink:last-child{flex-basis:100%;text-align:center}}
</style>
<link rel="stylesheet" href="/assets/byeollog-theme.css">
</head>
<body class="auth-page login-page">
<form class="card" id="loginForm">
  <header class="login-header">
    <a href="/" aria-label="별록 홈"><img class="brand-logo compact" src="/assets/byeollog_logo_dark.png" alt="별록 BYEOLLOG"></a>
    <h1>로그인</h1>
  </header>
  <div class="field">
    <label for="loginId">이메일</label>
    <input id="loginId" type="text" autocomplete="username" placeholder="이메일 입력" autofocus required>
  </div>
  <div class="field">
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password" required>
  </div>
  <button type="submit">로그인</button>
  <div class="msg" id="msg"></div>
  <div class="links"><a class="signupLink" href="/guide" target="_blank" rel="noopener">설정 매뉴얼</a><span class="sep">·</span><a class="signupLink" href="/reset-password">비밀번호 찾기</a><span class="sep">·</span><a class="signupLink" href="/signup">스트리머 회원가입</a></div>
</form>
<footer class="byeollogSiteFooter">© 2026 BYEOLLOG</footer>
<script src="/assets/login-page.js" defer></script>
</body>
</html>
