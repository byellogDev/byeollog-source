<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별록 비밀번호 재설정</title><link rel="icon" href="/assets/byeollog_app_icon.png"><link rel="stylesheet" href="/assets/byeollog-theme.css"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#1f2937;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(380px,calc(100% - 32px));background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;box-shadow:0 12px 35px #11182712}.brand{display:flex;align-items:center;gap:11px}.mark{font-size:31px;color:#f4c542}h1{font-size:24px;margin:0}.desc{color:#64748b;font-size:13px;line-height:1.6;margin:12px 0 18px}.field{margin-top:12px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input{width:100%;border:1px solid #d8dee8;border-radius:9px;padding:11px 12px;font:inherit}button{width:100%;margin-top:16px;border:0;border-radius:9px;padding:11px 12px;background:#f4c542;color:#172033;font:inherit;font-weight:800;cursor:pointer}.msg{min-height:20px;margin-top:10px;font-size:13px;color:#b42318;line-height:1.5}.msg.ok{color:#067647}.back{display:block;text-align:center;margin-top:14px;color:#475569;font-size:13px;text-decoration:none}.hidden{display:none}
</style></head><body class="auth-page reset-page"><main class="card"><img class="brand-logo compact" src="/assets/byeollog_logo_dark.png" alt="별록 BYEOLLOG"><div class="brand"><h1>비밀번호 재설정</h1></div>
<form id="requestForm"><p class="desc">가입한 이메일로 재설정 링크를 보내드립니다.</p><div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required autofocus></div><button type="submit">재설정 메일 받기</button></form>
<form id="confirmForm" class="hidden"><p class="desc">새 비밀번호는 10자 이상이며 영문 대·소문자·숫자·특수문자를 각각 포함해야 합니다. 변경이 끝나면 모든 관리자 세션에서 다시 로그인해야 합니다.</p><div class="field"><label for="password">새 비밀번호</label><input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div><div class="field"><label for="passwordConfirm">새 비밀번호 확인</label><input id="passwordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div><button type="submit">새 비밀번호 저장</button></form>
<div id="msg" class="msg"></div><a id="loginLink" class="back" href="/login">로그인으로 돌아가기</a></main><footer class="byeollogSiteFooter">© 2026 BYEOLLOG</footer><script src="/assets/reset-password-page.js" defer></script></body></html>
