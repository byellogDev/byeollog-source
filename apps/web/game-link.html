<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>별록 X 마인크래프트 | 계정 연동</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #143a69, #071a38 52%); color: #f7f9ff; }
      main { width: min(720px, 100%); padding: clamp(28px, 6vw, 52px); border: 1px solid #34557f; border-radius: 28px; background: #0b2144ed; box-shadow: 0 24px 80px #0007; }
      .eyebrow { margin: 0; color: #ffc44d; font-size: 14px; font-weight: 900; letter-spacing: .1em; }
      h1 { margin: 14px 0; font-size: clamp(34px, 8vw, 58px); line-height: 1.05; }
      .lead { color: #c8d5eb; font-size: 18px; line-height: 1.7; }
      ol { margin: 28px 0; padding-left: 22px; color: #dce6f7; line-height: 1.9; }
      a.button { display: inline-block; padding: 15px 22px; border-radius: 14px; background: #ffc44d; color: #071a38; font-weight: 900; text-decoration: none; }
      .note { margin-top: 22px; color: #91a8c7; font-size: 13px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">별록 X 마인크래프트</p>
      <h1>스트리머 계정 연동</h1>
      <p class="lead">SOOP 계정과 Minecraft Java 프로필을 안전하게 연결합니다.</p>
      <ol>
        <li>SOOP 계정으로 본인 확인</li>
        <li>Microsoft 계정으로 Minecraft 보유 프로필 확인</li>
        <li>SOOP ID ↔ Minecraft UUID 연결 완료</li>
      </ol>
      <a class="button" href="/api/game-link/soop/start">SOOP 로그인으로 시작</a>
      <p class="note">Microsoft·Xbox·Minecraft 접근 토큰은 저장하지 않습니다.</p>
    </main>
  </body>
</html>
