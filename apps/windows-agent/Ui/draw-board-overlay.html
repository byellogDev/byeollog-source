<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별록 뽑기판</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Malgun Gothic','Segoe UI',sans-serif}#board{height:100%;padding:28px;display:flex;flex-direction:column;gap:18px;background:#0c2036ed;color:#f5f9ff;border-radius:24px}#board[hidden]{display:none}header{display:flex;align-items:center;justify-content:space-between;gap:24px}h1{margin:0;font-size:clamp(20px,3vw,46px)}#count{font-size:clamp(16px,2vw,30px);color:#bcd1e5}.grid{flex:1;min-height:0;display:grid;gap:7px;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(0,1fr))}.cell{min-width:0;min-height:0;overflow:hidden;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:3px;border-radius:9px;border:1px solid #3c5d7d;background:#1a3956;color:#f2f7ff;font-size:clamp(10px,var(--font),52px);font-weight:800;text-align:center}.cell span{opacity:.8}.cell strong{font-size:clamp(8px,var(--label),32px);max-width:98%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cell small{font-size:clamp(8px,var(--actor),22px);max-width:95%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cell.open span{font-size:clamp(8px,var(--actor),22px)}.cell.win{background:#ffce64;color:#112944;border-color:#ffe2a1}.cell.blank{background:#142b40;color:#a3b6c8;border-color:#2a455f}.cell.highlight{background:#eaf6ff;color:#163652;outline:4px solid #ffc64a;outline-offset:-4px}.dense .cell small{display:none}.cell.reveal{animation:flip .55s ease-out}@keyframes flip{0%{transform:rotateY(85deg)}100%{transform:rotateY(0)}}#latest{min-height:38px;margin:0;font-size:clamp(14px,2vw,30px);font-weight:700;color:#ffdb86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#connection{position:fixed;bottom:0;right:16px;color:#fff;background:#783d10;padding:6px 12px;border-radius:8px;font-size:16px}#connection:empty{display:none}@media(prefers-reduced-motion:reduce){.cell.reveal{animation:none}}
</style></head><body><main id="board" hidden><header><h1 id="title"></h1><span id="count"></span></header><div id="grid" class="grid"></div><p id="latest" aria-live="polite"></p></main><p id="connection"></p>
<script>
(()=>{'use strict';const root=document.getElementById('board'),grid=document.getElementById('grid'),latest=document.getElementById('latest'),notice=document.getElementById('connection');let id='',seen=new Set(),cells=[],first=true,failures=0;
function fit(){const cell=cells[1];if(!cell)return;const side=Math.min(cell.clientWidth,cell.clientHeight);grid.style.setProperty('--font',Math.max(8,Math.min(52,side*.48))+'px');grid.style.setProperty('--label',Math.max(8,Math.min(32,side*.28))+'px');grid.style.setProperty('--actor',Math.max(7,Math.min(22,side*.18))+'px');grid.classList.toggle('dense',cell.clientHeight<60);}window.addEventListener('resize',fit);
function render(state){const b=state.board;if(!b){root.hidden=true;id='';seen.clear();cells=[];return;}root.hidden=false;
if(id!==b.id){id=b.id;first=true;seen=new Set();cells=[];grid.replaceChildren();latest.textContent='';document.getElementById('title').textContent=b.title;const rows=Math.ceil(b.size/b.columns);grid.style.setProperty('--cols',b.columns);grid.style.setProperty('--rows',rows);grid.style.setProperty('--font',Math.min(52,65/b.columns)+'vw');grid.style.setProperty('--label',Math.min(32,50/b.columns)+'vw');grid.style.setProperty('--actor',Math.min(22,35/b.columns)+'vw');for(let n=1;n<=b.size;n++){const cell=document.createElement('div');cell.className='cell';const num=document.createElement('span');num.textContent=n;cell.append(num);grid.append(cell);cells[n]=cell;}}
for(const r of b.results){if(seen.has(r.number))continue;seen.add(r.number);const cell=cells[r.number];if(!cell)continue;cell.className='cell open '+(r.prize?'win':'blank')+(!first?' reveal':'');const prize=document.createElement('strong');prize.textContent=r.prize||'꽝';cell.append(prize);if(r.actor){const who=document.createElement('small');who.textContent=r.actor;cell.append(who);}latest.textContent=(r.actor?r.actor+' · ':'')+r.number+'번 · '+(r.prize||'꽝');}
for(let n=1;n<cells.length;n++)cells[n].classList.toggle('highlight',n===state.highlighting&&!seen.has(n));
document.getElementById('count').textContent=b.results.length+' / '+b.size;first=false;fit();notice.textContent=state.error?'후원 연결 확인 중':'';}
async function poll(){try{const response=await fetch('/overlay/draw-board-state',{cache:'no-store'});if(!response.ok)throw Error();render(await response.json());failures=0;}catch{if(++failures>=3){root.hidden=true;id='';notice.textContent='Agent 연결 확인 중';}}finally{setTimeout(poll,500);}}poll();})();
</script></body></html>
