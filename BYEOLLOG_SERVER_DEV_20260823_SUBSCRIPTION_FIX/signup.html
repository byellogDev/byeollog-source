<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>별록 회원가입 신청</title>
<link rel="icon" href="/assets/byeollog_app_icon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fa;color:#1f2937;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:36px 16px}.card{width:min(620px,100%);margin:auto;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 16px 45px #11182712}.brand{display:flex;align-items:center;gap:11px}.brandMark{font-size:31px;line-height:1;color:#f4c542}h1{font-size:25px;margin:0}.sub{margin:6px 0 24px 42px;color:#64748b;font-size:13px}.notice{padding:14px 16px;border:1px solid #f2d675;background:#fffbea;border-radius:12px;font-size:13px;line-height:1.6;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{min-width:0}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.req{color:#b42318}input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;border:1px solid #d8dee8;border-radius:9px;padding:11px 12px;font:inherit;background:#fff;color:#1f2937}textarea{min-height:92px;resize:vertical}.hint{font-size:11px;color:#64748b;margin-top:5px;line-height:1.45}.agree{display:flex;align-items:flex-start;gap:12px;margin-top:18px;font-size:13px;line-height:1.55}.agree input[type=checkbox]{width:18px;height:18px;min-width:18px;max-width:18px;min-height:18px;max-height:18px;margin:2px 0 0;padding:0;flex:0 0 18px;border:1px solid #c5d0dc;border-radius:4px;accent-color:#f4c542;cursor:pointer;box-shadow:none;-webkit-appearance:checkbox;appearance:auto}.agree span{flex:1;min-width:0;padding-top:1px}.agree a.policyLink{color:#2563eb;font-weight:700;text-decoration:underline;text-underline-offset:2px}.agree a.policyLink:hover{color:#1d4ed8}.agreeBox{margin-top:16px;display:flex;flex-direction:column;gap:10px}.actions{display:flex;gap:9px;margin-top:20px}.actions button,.actions a{flex:1;text-align:center;border-radius:9px;padding:12px;font:inherit;font-weight:800;text-decoration:none}.submit{border:0;background:#f4c542;color:#172033;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.back{border:1px solid #d8dee8;background:#fff;color:#475569}.msg{min-height:22px;margin-top:13px;font-size:13px}.msg.error{color:#b42318}.msg.ok{color:#067647}.done{display:none;text-align:center;padding:28px 8px}.doneLogo{margin:auto}.doneBrand{justify-content:center}.done h2{margin:0 0 10px}.done p{color:#64748b;line-height:1.7}@media(max-width:620px){body{padding:16px}.card{padding:20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.sub{margin-left:0}}
</style>
<link rel="stylesheet" href="/assets/byeollog-theme.css">
</head>
<body class="auth-page signup-page">
<main class="card">
  <div id="formArea">
    <a href="/" aria-label="별록 홈"><img class="brand-logo compact" src="/assets/byeollog_logo_dark.png" alt="별록 BYEOLLOG"></a>
    <div class="brand"><h1>스트리머 가입 신청</h1></div>
    <div class="sub">스트리머 전용 서비스 · 관리자 승인 후 이용 가능</div>
    <div class="notice">신청 후 별록 관리자가 스트리머 본인 여부를 확인합니다. 확인이 끝나고 가입이 승인되어야 별록 서비스를 사용할 수 있습니다.</div>
    <form id="signupForm">
      <div class="grid">
        <div class="field full"><label for="email">이메일 <span class="req">*</span></label><input id="email" type="email" autocomplete="email" required><div class="hint">승인 후 로그인에 사용할 이메일입니다.</div></div>
        <div class="field"><label for="streamerName">스트리머명 <span class="req">*</span></label><input id="streamerName" maxlength="80" placeholder="방송에서 사용하는 이름" required></div>
        <div class="field"><label for="soopId">SOOP ID <span class="req">*</span></label><input id="soopId" maxlength="40" pattern="[A-Za-z0-9_-]{2,40}" placeholder="방송국 주소의 ID" required></div>
        <div class="field full"><label for="stationUrl">SOOP 방송국 주소</label><input id="stationUrl" readonly placeholder="SOOP ID 입력 시 자동 생성"><div class="hint">본인 확인에 사용됩니다.</div></div>
        <div class="field full"><label for="note">관리자에게 전달할 내용</label><textarea id="note" maxlength="1000" placeholder="본인 확인에 필요한 설명이 있다면 입력해주세요."></textarea></div>
      </div>
      <div class="agreeBox">
        <label class="agree"><input id="agreeTerms" type="checkbox" required><span><a class="policyLink" href="/terms" target="_blank" rel="noopener noreferrer">이용약관</a> 및 <a class="policyLink" href="/privacy" target="_blank" rel="noopener noreferrer">개인정보처리방침</a>에 동의합니다. <span class="req">*</span></span></label>
        <label class="agree"><input id="agreeCollect" type="checkbox" required><span>가입 심사와 본인 확인을 위해 입력한 정보를 수집·이용하는 것에 동의합니다. <span class="req">*</span></span></label>
      </div>
      <div class="actions"><a class="back" href="/login">로그인으로 돌아가기</a><button class="submit" id="submitBtn" type="submit">가입 신청</button></div>
      <div id="msg" class="msg"></div>
    </form>
  </div>
  <section id="doneArea" class="done"><img class="brand-logo compact doneLogo" src="/assets/byeollog_logo_dark.png" alt="별록 BYEOLLOG"><div class="brand doneBrand"><h2 id="doneTitle">가입 신청 완료</h2></div><p id="doneDescription">관리자가 스트리머 본인 여부를 확인합니다.<br>이 화면에서 승인 상태를 직접 확인할 수 있습니다.</p><div class="actions"><a class="submit" id="statusLink" href="/signup-status">가입 상태 확인</a><a class="back" href="/login">로그인 화면으로 이동</a></div></section>
</main>
<script src="/assets/signup-page.js" defer></script>
</body>
</html>
