<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>비밀번호 변경 — 별록</title>
<link rel="icon" href="/assets/byeollog_app_icon.png">
<link rel="stylesheet" href="/assets/byeollog-theme.css">
<style>
:root{
  --navy:#0b1220;--panel:#132238;--line:#2a3850;--text:#e8edf5;--muted:#9aa8bc;
  --yellow:#f4c542;--yellow2:#e3b12a;--ok:#50d4a6;--danger:#ff8d95;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(900px 420px at 15% -10%, #f4c54222, transparent 60%),
    radial-gradient(700px 380px at 100% 10%, #3b82f622, transparent 55%),
    linear-gradient(165deg,#0b1220 0%,#152238 55%,#0f1a2e 100%);
  display:flex;align-items:center;justify-content:center;padding:28px 16px;
}
.shell{width:min(440px,100%)}
.brand-row{display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.brand-row img{height:36px;width:auto}
.card{
  background:linear-gradient(180deg,#17263d,#122033);
  border:1px solid var(--line);border-radius:22px;padding:28px 26px 24px;
  box-shadow:0 28px 70px #02061790, inset 0 1px 0 #ffffff10;
}
.eyebrow{color:var(--yellow);font-size:12px;font-weight:800;letter-spacing:.12em;margin:0 0 8px}
h1{margin:0;font-size:24px;letter-spacing:-.03em}
.desc{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.field{margin-top:16px}
label{display:block;font-size:12px;font-weight:800;color:#d5e0ef;margin:0 0 7px}
input{
  width:100%;min-height:46px;border-radius:12px;border:1px solid #334155;
  background:#0b1628;color:var(--text);padding:0 14px;font:inherit;
  outline:none;transition:border-color .15s, box-shadow .15s;
}
input:focus{border-color:#f4c54299;box-shadow:0 0 0 3px #f4c54222}
.hint{margin-top:6px;font-size:11px;color:#7f8da1}
button[type=submit]{
  width:100%;min-height:48px;margin-top:20px;border:0;border-radius:12px;
  background:var(--yellow);color:#172033;font:inherit;font-weight:900;cursor:pointer;
}
button[type=submit]:hover{background:var(--yellow2)}
button[type=submit]:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:12px;font-size:13px;line-height:1.5;color:var(--danger)}
.msg.ok{color:var(--ok)}
.links{display:flex;justify-content:center;gap:14px;margin-top:16px}
.links a{color:var(--muted);font-size:13px;text-decoration:none;font-weight:700}
.links a:hover{color:var(--yellow)}
</style>
</head>
<body>
  <div class="shell">
    <div class="brand-row">
      <a href="/" aria-label="별록 홈"><img src="/assets/byeollog_logo_dark.png" alt="별록 BYEOLLOG"></a>
    </div>
    <form class="card" id="form">
      <div class="eyebrow">ACCOUNT</div>
      <h1>비밀번호 변경</h1>
      <p class="desc">현재 비밀번호를 확인한 뒤 새 비밀번호로 바꿉니다. 변경이 끝나면 새 비밀번호로 다시 로그인해 주세요.</p>

      <div class="field">
        <label for="current">현재 비밀번호</label>
        <input id="current" type="password" autocomplete="current-password" required autofocus>
      </div>
      <div class="field">
        <label for="password">새 비밀번호</label>
        <input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
        <div class="hint">10자 이상, 영문 대·소문자·숫자·특수문자를 각각 포함해 주세요.</div>
      </div>
      <div class="field">
        <label for="confirm">새 비밀번호 확인</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
      </div>

      <button type="submit">비밀번호 변경</button>
      <div id="msg" class="msg"></div>
      <div class="links">
        <a href="/dashboard">대시보드</a>
        <a href="/">홈</a>
      </div>
    </form>
  </div>
<script src="/assets/change-password-page.js" defer></script>
</body>
</html>
