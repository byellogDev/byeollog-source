<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>업보 현황</title>
<link rel="icon" href="/assets/byeollog_app_icon.png">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0f172a;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
.wrap{max-width:820px;margin:0 auto;padding:24px}
h1{margin:0 0 6px;font-size:28px}
.muted{color:#94a3b8}
.panel{
  background:#111c33;
  border:1px solid #22304c;
  border-radius:16px;
  padding:16px;
  margin-top:16px
}
.search{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #334155;
  background:#0b1220;
  color:#fff;
  font:inherit;
  outline:none
}
.search:focus{border-color:#60a5fa}
.status{margin-top:10px;font-size:13px;color:#94a3b8}
.fan{
  margin-top:12px;
  padding:0;
  border:1px solid #2b3a57;
  border-radius:14px;
  background:#111c33;
  overflow:hidden
}
.fan:first-child{margin-top:0}
.fan-name{
  font-weight:800;
  font-size:18px;
  padding:15px 16px;
  cursor:pointer;
  user-select:none;
  display:flex;
  align-items:center;
  gap:8px
}
.fan-name:hover{background:#15213a}
.fan-content{
  padding:0 16px 16px;
  border-top:1px solid rgba(255,255,255,.07)
}
.fan.collapsed .fan-content{display:none}
.fan-toggle{
  color:#94a3b8;
  font-size:12px;
  white-space:nowrap
}
.fan-summary{
  margin-left:auto;
  color:#93c5fd;
  font-size:14px;
  font-weight:800;
  white-space:nowrap
}
.event{
  font-weight:800;
  color:#fff;
  font-size:15px;
  margin:16px 0 8px;
  padding:10px 12px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
  border-radius:10px;
  letter-spacing:-.2px
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:8px 0
}
.type{color:#f8fafc}
.type-wrap{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px
}
.comment-public{
  color:#94a3b8;
  font-size:12px;
  line-height:1.35;
  overflow-wrap:anywhere
}
.remain{
  font-weight:800;
  white-space:nowrap;
  color:#93c5fd
}
.empty{padding:18px 0;color:#94a3b8}
.badge{
  display:inline-block;
  margin-left:8px;
  padding:2px 7px;
  border-radius:999px;
  background:#172554;
  color:#bfdbfe;
  font-size:12px;
  vertical-align:2px
}
@media(max-width:600px){
  .wrap{padding:16px}
  h1{font-size:24px}
  .panel{padding:14px}
}

.type-row:last-child{
  border-bottom:1px solid rgba(255,255,255,.09);
  border-radius:0 0 10px 10px;
}
.fan-content .event:first-child{margin-top:14px}

</style>
<link rel="stylesheet" href="/assets/byeollog-theme.css">
</head>
<body class="viewer-page">
<div class="wrap">
  <header class="viewer-brand"><a href="/" aria-label="별록 홈"><img class="brand-logo compact" src="/assets/byeollog_logo_dark.png" alt="별록 BYEOLLOG"></a><div class="viewer-heading"><h1>업보 현황 <span id="workspaceBadge" class="badge"></span></h1><div id="pageSubtitle" class="muted">닉네임을 검색해서 남은 업보를 확인하세요.</div></div></header>

  <div id="searchPanel" class="panel">
    <input id="search" class="search" placeholder="별명 또는 SOOP ID 검색" autocomplete="off">
    <div id="state" class="status">서버 연결 중...</div>
  </div>

  <div id="list" style="margin-top:16px">
    <div class="panel empty">목록을 불러오는 중입니다.</div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const pathWorkspace = location.pathname.match(/^\/u\/([^/]+)\/?$/i)?.[1] || '';
const WORKSPACE_SLUG = (params.get('workspace') || pathWorkspace).trim().toLowerCase();

const VALID_WORKSPACE = /^[a-z0-9][a-z0-9_-]{1,62}$/.test(WORKSPACE_SLUG);

let records = [];
let workspaceChecked = false;
let workspaceExists = false;
const openFans = new Set();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));

function firstParagraph(text){
  const s=String(text||'').trim();
  if(!s)return '';
  return s.split(/\r?\n/)[0].trim();
}

function remaining(r){
  return Math.max(0, (+r.remaining || 0));
}

async function loadData(){
  if (!VALID_WORKSPACE) {
    $('searchPanel').style.display = 'none';
    $('pageSubtitle').textContent = '요청하신 시청자 페이지를 찾을 수 없습니다.';
    $('state').textContent = '워크스페이스가 지정되지 않았습니다.';
    $('list').innerHTML =
      '<div class="panel empty">올바른 시청자용 업보 현황 주소로 접속해 주세요.</div>';
    return;
  }

  if (workspaceChecked && !workspaceExists) {
    $('workspaceBadge').textContent = '없는 계정';
    $('pageSubtitle').textContent = '요청하신 시청자 페이지를 찾을 수 없습니다.';
    $('searchPanel').style.display = 'none';
    $('list').innerHTML = '<div class="panel empty"><b style="color:#f8fafc">존재하지 않는 시청자 페이지입니다.</b><br><span style="display:inline-block;margin-top:7px">주소의 계정명을 확인해 주세요.</span></div>';
    return;
  }

  try {
    $('state').textContent = '서버에서 최신 목록 확인 중...';

    if (!workspaceChecked) {
      const workspaceRes = await fetch(
        '/api/data?operation=public-workspace',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ p_workspace_slug: WORKSPACE_SLUG }),
          cache: 'no-store'
        }
      );
      const workspaceRaw = await workspaceRes.text();
      let workspaceData = null;
      try {
        workspaceData = workspaceRaw ? JSON.parse(workspaceRaw) : [];
      } catch {
        throw new Error('워크스페이스 확인 응답을 읽을 수 없습니다.');
      }
      if (!workspaceRes.ok) {
        throw new Error(workspaceData?.message || workspaceData?.error || ('HTTP ' + workspaceRes.status));
      }
      const workspace = Array.isArray(workspaceData) ? workspaceData[0] : null;
      if (!workspace) {
        workspaceChecked = true;
        workspaceExists = false;
        records = [];
        $('workspaceBadge').textContent = '없는 계정';
        $('pageSubtitle').textContent = '요청하신 시청자 페이지를 찾을 수 없습니다.';
        $('searchPanel').style.display = 'none';
        $('list').innerHTML = '<div class="panel empty"><b style="color:#f8fafc">존재하지 않는 시청자 페이지입니다.</b><br><span style="display:inline-block;margin-top:7px">주소의 계정명을 확인해 주세요.</span></div>';
        return;
      }
      workspaceChecked = true;
      workspaceExists = true;
      $('workspaceBadge').textContent = String(workspace.display_name || workspace.slug || WORKSPACE_SLUG);
      if (workspace.public_page_enabled === false) {
        $('searchPanel').style.display = 'none';
        $('pageSubtitle').textContent = '이 스트리머는 현재 시청자용 업보 현황을 비공개로 두었습니다.';
        $('state').textContent = '';
        $('list').innerHTML = '<div class="panel empty"><b style="color:#f8fafc">지금은 업보 현황이 비공개입니다.</b><br><span style="display:inline-block;margin-top:7px">스트리머가 공개를 다시 켜면 이 페이지에서 확인할 수 있습니다.</span></div>';
        return;
      }
      $('searchPanel').style.display = '';
      $('pageSubtitle').textContent = '별명 또는 SOOP ID로 검색해 남은 업보를 확인하세요.';
    }

    const searchTerm = ($('search')?.value || '').trim() || null;
    const res = await fetch(
      '/api/data?operation=public-bangsel',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_workspace_slug: WORKSPACE_SLUG, p_search: searchTerm }),
        cache: 'no-store'
      }
    );
    let data = null;


    const raw = await res.text();



    try {


      data = raw ? JSON.parse(raw) : [];


    } catch (parseError) {


      if (!res.ok) {


        throw new Error(`서버 오류 (HTTP ${res.status})`);


      }


      throw new Error('서버 응답을 읽는 중 오류가 발생했습니다.');


    }


    if (!res.ok) {
      throw new Error(data?.message || data?.error || ('HTTP ' + res.status));
    }

    records = Array.isArray(data) ? data : [];
    $('state').textContent =
      '자동 갱신 중 · ' + new Date().toLocaleTimeString('ko-KR', {
        hour:'2-digit', minute:'2-digit', second:'2-digit'
      }) + ' 기준';

    render();
  } catch (e) {
    $('state').textContent = '서버 연결 오류: ' + e.message;
    $('list').innerHTML =
      '<div class="panel empty">목록을 불러오지 못했습니다. 잠시 후 자동으로 다시 시도합니다.</div>';
  }
}

$('workspaceBadge').textContent = VALID_WORKSPACE ? '확인 중' : '주소 오류';

function render(){
  const q = $('search').value.trim().toLowerCase();

  // 서버에서 별명·SOOP ID로 필터링됨. 응답/화면에는 등록 별명(fan)만 사용 (SOOP ID 비공개).
  const active = records.filter(r => remaining(r) > 0);

  const fans = new Map();

  for (const r of active) {
    const fan = String(r.fan || '미지정').trim() || '미지정';
    if (!fans.has(fan)) fans.set(fan, []);
    fans.get(fan).push(r);
  }

  if (!fans.size) {
    $('list').innerHTML =
      '<div class="panel empty">' +
      (q ? '검색 결과가 없습니다.' : '현재 남아 있는 업보가 없습니다.') +
      '</div>';
    return;
  }

  const html = [...fans.entries()].map(([fan, items]) => {
    const events = new Map();

    for (const r of items) {
      const event = String(r.event || '').trim() || '기타';
      if (!events.has(event)) events.set(event, []);
      events.get(event).push(r);
    }

    const totalRemain = items.reduce((sum, r) => sum + remaining(r), 0);

    const eventHtml = [...events.entries()].map(([event, rows]) => {
      const rowsHtml = rows.map(r => {
        const comment = firstParagraph(r.comment);
        return `
        <div class="row">
          <span class="type-wrap">
            <span class="type">${esc(r.type || '미지정')}</span>
            ${comment ? `<span class="comment-public">${esc(comment)}</span>` : ''}
          </span>
          <span class="remain">${remaining(r)}개 남음</span>
        </div>
      `;
      }).join('');

      return `
        <div class="event">${esc(event)}</div>
        ${rowsHtml}
      `;
    }).join('');

    const isOpen=openFans.has(fan);
    return `
      <div class="fan ${isOpen?'':'collapsed'}" data-fan="${encodeURIComponent(fan)}">
        <div class="fan-name" onclick="toggleFan(this)">
          <span>${esc(fan)}</span>
          <span class="fan-summary">총 ${totalRemain}장 남음</span>
          <span class="fan-toggle">${isOpen?'접기 ▲':'펼치기 ▼'}</span>
        </div>
        <div class="fan-content">
          ${eventHtml}
        </div>
      </div>
    `;
  }).join('');

  $('list').innerHTML = html;
}

function toggleFan(header){
  const card=header.closest('.fan');
  const fan=decodeURIComponent(card.dataset.fan||'');
  card.classList.toggle('collapsed');
  const isCollapsed=card.classList.contains('collapsed');
  if(isCollapsed) openFans.delete(fan);
  else openFans.add(fan);
  const t=header.querySelector('.fan-toggle');
  if(t) t.textContent=isCollapsed?'펼치기 ▼':'접기 ▲';
}

let searchDebounceTimer = null;
$('search').addEventListener('input', () => {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    // SOOP ID 검색은 서버에서만 매칭 가능 → 목록 재조회
    loadData();
  }, 320);
});

loadData();

let refreshTimer = null;

function startAutoRefresh(){
  if (refreshTimer || document.hidden) return;

  refreshTimer = setInterval(() => {
    if (!document.hidden) {
      loadData();
    }
  }, 60000);
}

function stopAutoRefresh(){
  if (!refreshTimer) return;
  clearInterval(refreshTimer);
  refreshTimer = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopAutoRefresh();
  } else {
    loadData();
    startAutoRefresh();
  }
});

startAutoRefresh();
</script>
</body>
</html>
